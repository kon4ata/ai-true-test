services:
    postgres-db:
        container_name: ai-true-db
        image: postgres:18.3-alpine3.23
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /data/postgres
        ports:
          - '127.0.0.1:5432:5432'
        volumes:
            - db:/data/postgres
        networks:
            - ai-true-test
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 3s
            timeout: 3s
            retries: 5
            start_period: 3s

networks:
    ai-true-test:
        driver: bridge

volumes:
    db:
